services:
  express:
    build:
      context: .
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0.4
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
